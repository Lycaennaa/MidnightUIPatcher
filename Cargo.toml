[package]
name = "midnight-ui-patcher"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:gpui"]

[dependencies]
gpui = { version = "0.2.2", optional = true }
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

dirs = "6"
flate2 = "1"
tar = "0.4"
similar = "2"
[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
